version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: dentalcore_mysql
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-dentalcore}
      MYSQL_USER: ${DATABASE_USER:-dental}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-dentalpassword}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dental", "-pdentalpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
