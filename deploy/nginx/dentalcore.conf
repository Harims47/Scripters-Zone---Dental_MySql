# DentalCore Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/dentalcore
# Symlink to: /etc/nginx/sites-enabled/dentalcore

limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_mutations:10m rate=30r/m;

# 1. HTTP -> HTTPS Permanent Redirect
server {
    listen 80;
    listen [::]:80;
    server_name <PRODUCTION_DOMAIN>;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <PRODUCTION_DOMAIN>;

    # TLS Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/<PRODUCTION_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<PRODUCTION_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static Frontend SPA Root
    root /var/www/dentalcore/app/dist;
    index index.html;

    # Default Ingress Limit (blocks large arbitrary payloads before reaching Node.js)
    client_max_body_size 2M;

    # Production HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Single Authoritative X-Request-ID Pipeline
    set $request_correlation_id $http_x_request_id;
    if ($request_correlation_id = "") {
        set $request_correlation_id $request_id;
    }
    proxy_set_header X-Request-ID $request_correlation_id;
    add_header X-Request-ID $request_correlation_id always;

    # Static Assets Long-Term Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # High-Capacity Upload Route (Patient Photos & Attachments)
    location /api/patients {
        client_max_body_size 15M;
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Standard API Proxy Routing (/api/* -> Express on Port 3001)
    location /api/ {
        client_max_body_size 2M;
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket / Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Context
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
